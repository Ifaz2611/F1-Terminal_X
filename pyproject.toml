[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-terminal-x"
version = "1.1.0"
description = "High-octane toolkit for extracting, analysing and visualising Formula 1 telemetry"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "F1 Terminal X", email = "f1@example.com" }]
keywords = ["f1", "formula1", "telemetry", "fastf1", "motorsport"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.25.0",
  "pandas>=2.2.0",
  "matplotlib>=3.8.0",
  "scipy>=1.11.0",
  "fastf1>=3.1.0",
  "questionary>=2.0.0",
  "seaborn>=0.12.2",
  "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "jupyterlab>=4.0.0"]
gui = ["textual>=0.60.0", "rich>=13.0.0"]
tui = ["textual>=0.60.0", "rich>=13.0.0"]

[project.urls]
Repository = "https://github.com/Ifaz2611/f1-telemetry-terminal"
Issues = "https://github.com/Ifaz2611/f1-telemetry-terminal/issues"

[project.scripts]
f1-advanced = "f1_terminal.f1_advanced_visualizer:main"
f1-qualifying = "f1_terminal.f1_qualifying:main"
f1-practice = "f1_terminal.PracticeSession:main"
f1-telemetry = "F1_Main_py.f1:main"
f1-driver = "F1_Main_py.driver:main"
f1-schedule = "F1_Main_py.schedule_driver:main"

[tool.setuptools.packages.find]
include = ["f1_terminal*", "F1_Main_py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
